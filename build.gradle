import org.gradle.plugins.ide.eclipse.model.internal.FileReferenceFactory

import java.nio.file.Files
import java.nio.file.Paths
import java.nio.file.StandardCopyOption

buildscript {
	repositories {
		maven { url 'https://maven.aliyun.com/repository/public/' }
    	maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }
		maven { url = 'https://maven.ntmr.dev/proxy/' }
		maven { url = 'https://maven.minecraftforge.net/' }
		maven { url = 'https://plugins.gradle.org/m2' }
		mavenCentral()
	}
	dependencies {
		classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.0.+') {changing = true}
	}
}

apply plugin: 'forge'
apply plugin: 'curseforge'
apply plugin: 'maven-publish'


if(Files.exists(Paths.get("curseforge.properties"))) {
	// Load CurseForge configuration
	ext.cfprops = parseConfig(file("curseforge.properties"))
}

if(Files.exists(Paths.get("maven.properties"))) {
	ext.mavenprops = parseConfig(file("maven.properties"))
}

def version_name = version = mod_version
if(!mod_build_number.isEmpty()) {
	version_name = mod_version + "_X" + mod_build_number
	version = "[${version_name}]"
}
group = "com.hbm" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "HBM-NTM"
compileJava.options.encoding = 'UTF-8'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
	version = "1.7.10-10.13.4.1614-1.7.10"
	runDir = "eclipse"
}

// A little hack to fix codechicken's crazy maven structure (at least in 1.7.10)
eclipse.classpath.file.whenMerged { cp ->
	// Find all codechicken source jars
	def srcent = cp.entries.findAll { entry -> entry.path.contains("codechicken") && entry.path.endsWith("-src.jar") }

	// Remove them from classpath
	cp.entries.removeAll srcent

	// Map the source entries to their dev counterparts based on basename
	Map<String, File> srcmap = new HashMap<String, File>()
	srcent.forEach { entry ->
		def file = new File(entry.path)
		srcmap.put(file.getName().replace("-src.jar", "-dev.jar"), file)
	}

	// Create file reference factory
	def fileref = new FileReferenceFactory()

	// Find all codechicken development jars
	cp.entries.findAll { entry -> entry.path.contains("codechicken") && entry.path.endsWith("-dev.jar") }.forEach { entry ->
		File srcmapping = new File(entry.path) // Initialize the srcmapping from the dev jar path
		srcmapping = srcmap.get(srcmapping.getName()) // Transform it using the sourcemap
		entry.sourcePath = fileref.fromFile(srcmapping) // Set the source path
	}
}

repositories {
	maven {
		name = 'AliyunPublic'
		url = 'https://maven.aliyun.com/repository/public/'
	}
	mavenCentral()
	maven {
		name = 'Blerg'
		url = 'https://maven.ntmr.dev/proxy/'
	}
	maven {
		name = 'ModMaven'
		url = 'https://modmaven.dev'
	}
	maven {
		name = "gt"
		url = "https://gregtech.mechaenetia.com/"
	}
	//maven {
	//	name = "CurseForge"
	//	url = "https://minecraft.curseforge.com/api/maven/"
	//}
	maven {
		name = "Jitpack"
		url = "https://jitpack.io"
	}
	maven {
		name = "CurseMaven"
		url = "https://cursemaven.com"
	}
}

dependencies {
	implementation('codechicken:CodeChickenCore:1.7.10-1.0.4.29:dev') { transitive = false }
	compileOnly('codechicken:CodeChickenCore:1.7.10-1.0.4.29:src') { transitive = false }

	implementation('codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev') { transitive = false }
	compileOnly('codechicken:CodeChickenLib:1.7.10-1.1.3.140:src') { transitive = false }

	implementation('codechicken:NotEnoughItems:1.7.10-1.0.3.74:dev') { transitive = false }
	compileOnly('codechicken:NotEnoughItems:1.7.10-1.0.3.74:src') { transitive = false }

	compileOnly("inventorytweaks:InventoryTweaks:1.59-dev:deobf") { transitive = false }

	compileOnly("com.github.MightyPirates:OpenComputers:1.7.10-forge~1.8.9:api") { transitive = false }

	compileOnly("com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta.56-GTNH:dev") { transitive = false }

}


dependencies {
}

processResources {
	// this will ensure that this task is redone when the versions change.
	inputs.property "version", project.version
	inputs.property "mcversion", project.minecraft.version

	// replace stuff in mcmod.info, nothing else
	from(sourceSets.main.resources.srcDirs) {
		include 'mcmod.info'

		// replace version and mcversion
		filesMatching('mcmod.info') {
			// replace version, mcversion and credits
			expand([
					version: version_name,
					credits: project.credits
			])
		}
	}

	// copy everything else, thats not the mcmod.info
	from(sourceSets.main.resources.srcDirs) {
		exclude 'mcmod.info'
	}
}

// add AT to meta-inf
jar {
    manifest {
        attributes 'FMLAT': 'HBM_at.cfg'
    }
}

task sourceJar(type: Jar) {
	from sourceSets.main.allJava

	classifier "src"

	manifest {
		attributes 'FMLAT': 'HBM_at.cfg'
	}
}

task devJar(type: Jar) {
	// hack: artificially depend on the reobf task here to get the normal jar to be overwritten before publishing
	dependsOn reobf

	from(sourceSets.main.output) {
		include "**"
	}
	classifier "dev"

	manifest {
		attributes 'FMLAT': 'HBM_at.cfg'
	}
}

task version {
	doFirst {
		println project.version
	}
}

if(Files.exists(Paths.get("curseforge.properties"))) {
	curse {
		apiKey = cfprops.api_key
		projectId = cfprops.project_id
		releaseType = "release"

		displayName = "Hbm's Nuclear Tech Mod " + version_name.replace("_", "") + " for Minecraft 1.7.10"

		gameVersions.addAll([
				"Forge",
				"Java 8",
				"Client", "Server"
		])

		if (Files.exists(Paths.get("changelog"))) {
			changelog = String.join("\r\n", Files.readAllLines(Paths.get("changelog")))

			// Perform a backup of the changelog and create a new file for next changes
			doLast {
				Files.move(Paths.get("changelog"), Paths.get("changelog.bak"), StandardCopyOption.REPLACE_EXISTING)
				Files.createFile(Paths.get("changelog"))
			}
		}
	}
}

if(Files.exists(Paths.get("maven.properties"))) {
	publishing {
		publications {
			release(MavenPublication) {
				artifactId archivesBaseName
				version version_name

				artifact sourceJar {
					classifier "src"
				}

				artifact devJar {
					classifier "dev"
				}

				artifact jar
			}
		}
		repositories {
			maven {
				name "Nuggies"
				url "https://maven.ntmr.dev/releases"

				credentials {
					username mavenprops.username
					password mavenprops.password
				}
				authentication {
					basic(BasicAuthentication)
				}
			}
		}
	}
}

// Properties file parsing helper
static def parseConfig(File config) {
	config.withReader {
		def prop = new Properties()
		prop.load(it)
		return (new ConfigSlurper().parse(prop))
	}
}


// ============================================================
//  附属模组打包（Make NTM Great Again）
// ============================================================

// 附属版本号。改动时请同步修改下面三处，四份内容必须一致：
//   1) 这里的 ext.addon_version
//   2) MakeNTMGreatAgain.java 里的 VERSION
//   3) src/addon/resources/mcmod.info 里的 version（独立 jar 用）
//   4) src/main/resources/mcmod.info 里 modid=makentmgreatagain 那一条的 version
//      —— 为什么本体那份里也有附属一条，见下面的说明
ext.addon_version = "1.0.0-beta.4"

/**
 * 【为什么 src/main/resources/mcmod.info 里有两条】
 *
 * 本工程的 jar 任务（`gradlew build`）打的是 sourceSets.main.output 的**全部**内容，
 * 而附属的代码就在 src/main/java/com/makentmgreatagain 下，所以
 * build/libs/HBM-NTM-*.jar 里同时装着 com/hbm（本体）和 com/makentmgreatagain（附属）。
 *
 * 开发环境（runClient）加载的正是这个 jar —— 运行日志里能看到
 * 「Found a minecraft related file at build\libs\HBM-NTM-xxx.jar」。
 * 而 FML 给一个 jar 里所有 @Mod 绑定的元数据，来自该 jar 根目录那唯一一份 mcmod.info。
 * 里面只有 modid=hbm 一条时，附属在游戏内模组列表里就会显示
 * 「No mod information found / Ask your mod author to provide a mod mcmod.info file」。
 *
 * 所以本体那份必须补上附属这一条 —— 这是「jar 里有几个 @Mod，mcmod.info 里就得有几条」。
 * 独立发布的附属 jar（buildAddonJar）仍然只取 src/addon/resources/mcmod.info，不受影响。
 */

/**
 * 打包附属模组。
 *
 * 本工程同时是 HBM 本体的源码工程，所以 sourceSets.main.output 里
 * 混着 HBM 的全部编译产物（com/hbm/**、assets/hbm/** 以及 HBM 自己的 mcmod.info）。
 * 这里用「每个来源分别指定 include」的写法做白名单过滤：
 *   - 只取 com/makentmgreatagain/** 与 assets/makentmgreatagain/**
 *   - 只从 src/addon/resources 取 mcmod.info（附属自己的简介）
 * 这样 HBM 本体的类、资源和简介都不会被误打进附属包。
 *
 * 注意 HBM 的 mcmod.info 必须排除：附属包里若出现 modid=hbm 的简介，
 * 游戏内模组列表会显示成 HBM，而且可能与整合包里的真 HBM 冲突。
 */
task buildAddonJar(type: Jar) {
	archiveName = "MakeNTMGreatAgain-${addon_version}.jar"

	from(sourceSets.main.output) {
		include 'com/makentmgreatagain/**'
		include 'assets/makentmgreatagain/**'
		/**
		 * HBM 的 QMAW 手册页只认 assets/hbm/manual/ 这个固定路径，
		 * 附属的页面（海水路线、泵的介质表等）也放在这里，不然 F1 找不到。
		 * 开发环境靠 QMAWLoader 扫源码目录兜底，所以这里漏了也测不出来，
		 * 只有打包成独立 jar 之后才会整批消失。
		 */
		include 'assets/hbm/manual/makentmgreatagain/**'
	}

	from('src/addon/resources') {
		include 'mcmod.info'
	}

	/**
	 * MANIFEST 是发布版能否加载 coremod 的唯一依据。
	 *
	 * 开发环境（runClient）不读 jar 的 MANIFEST，而是靠下面的
	 * -Dfml.coreMods.load JVM 参数加载，所以开发时测不出 MANIFEST 的问题；
	 * 放进整合包后只有 MANIFEST 生效。缺了这两行，
	 * ArcFurnaceTransformer 不会运行，CMB 电极就进不了电弧炉（且不报错）。
	 *
	 * FMLCorePlugin            指定 coremod 入口类
	 * FMLCorePluginContainsFMLMod  声明「这个 coremod jar 里同时也装着普通 @Mod」，
	 *                              不加的话 FML 会跳过对本 jar 的模组扫描，
	 *                              附属的物品全都不会注册。
	 */
	manifest {
		attributes 'FMLCorePlugin': 'com.makentmgreatagain.core.MakeNTMGreatAgainCorePlugin'
		attributes 'FMLCorePluginContainsFMLMod': 'true'
	}
}

/**
 * 重混淆（reobf）—— 发布前必须执行，不可跳过。
 *
 * 开发环境里 Minecraft 的方法与字段是 MCP 名（getMaxItemUseDuration、stackSize），
 * 但玩家整合包与服务端里跑的是 SRG 名（func_77626_a、field_77777_bU）。
 * 已核对过你下载的两个发布版 HBM jar，里面确实全是 SRG 名。
 * 所以不重混淆的附属 jar 一进整合包就会 NoSuchMethodError 崩溃。
 *
 * reobf 是 ForgeGradle 已经配置好的任务（含 srg 映射表、deobf/recomp 文件等），
 * 上面的 `reobf.reobf(buildAddonJar)` 只是把 buildAddonJar 的产物登记进
 * reobf 的处理列表，**reobf 本身仍是独立任务，不会随 buildAddonJar 自动运行**。
 * reobf 执行时会「就地覆盖」原 jar，因此打包命令必须两个任务一起跑：
 *
 *     gradlew buildAddonJar reobf
 *
 * 执行顺序：先打普通包，再重混淆覆盖，产物仍是
 * build/libs/MakeNTMGreatAgain-<版本>.jar（无 -obf 后缀）。
 * 如果只想跑 reobf（已打包过且未改代码），单独运行 `gradlew reobf` 即可。
 *
 * ------------------------------------------------------------------
 * 【坑 2 · 附属包必须给 reobf 单独指定 classpath】2026-10-31 实测
 *
 * reobf 用 SpecialSource 重混淆。判断「某个方法是不是原版方法的重写」时，
 * 映射表里只有原版类的条目，所以它要沿继承链往上爬：
 * 本类查不到 → 问父类 → 再问祖父类，直到命中为止。
 *
 * 而继承链的查找来源，默认取自 jar 任务自己的 source
 * （ArtifactSpec(AbstractArchiveTask) 里 classpath = task.getSource()）。
 * buildAddonJar 的 source 只有 com/makentmgreatagain/**，
 * 父类 com.hbm.blocks.BlockDummyable 不在包内 → 继承链第二层就断了 →
 * reobf 认定 createNewTileEntity 是自定义方法，名字原样保留。
 *
 * 本体包为什么没事：它的 jar 里 com/hbm/** 和方块类在同一个包，
 * 链是完整的，同一个类能正常转成 func_149915_a。
 * 附属包却留成 MCP 名 → 整合包里 BlockContainer 的抽象方法没有实现 →
 * java.lang.AbstractMethodError，放置方块瞬间崩溃；
 * 同时 getIcon / registerBlockIcons 也没转，材质取不到 → 模型消失。
 * （高级粉碎机崩的就是这个）
 *
 * 修法：把「编译产物 + 完整编译类路径」显式喂给 reobf，
 * 让继承链能查到 com.hbm.* 与 MCP 名的 net.minecraft.*。
 * 之后新增多层继承的方块/物品，无需再靠强转写法绕坑。
 */
reobf.reobf(buildAddonJar) { spec ->
	spec.classpath = project.files(
		sourceSets.main.output,          // com.hbm.* 编译产物 —— 补上直接父类
		sourceSets.main.compileClasspath // MCP 名的 net.minecraft.* —— 补上更上层
	)
}

// 开发环境不读 jar manifest，必须用 JVM 参数显式加载 coremod
runClient {
	jvmArgs '-Dfml.coreMods.load=com.makentmgreatagain.core.MakeNTMGreatAgainCorePlugin'
	// 启动提速：加大堆内存（默认堆很小，加载 HBM 时频繁 GC）+ G1 回收器
	jvmArgs '-Xmx2G', '-XX:+UseG1GC'
	// 热加载：开 JDWP 调试端口，IDEA 用 Remote JVM Debug 连 localhost:5005，
	// 之后改 Java 数字只需 Ctrl+Shift+F9 重编译 + Reload，不用重启游戏
	jvmArgs '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005'
}

// 专用服务端同样需要显式加载 coremod，否则联机测试时电极补丁不生效
runServer {
	jvmArgs '-Dfml.coreMods.load=com.makentmgreatagain.core.MakeNTMGreatAgainCorePlugin'
}

